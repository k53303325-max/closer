# Этап 1 — тексты бота (меняйте здесь, код подхватит сам)

bot:
  short_description: >-
    Договор оказания услуг за 10 минут: опишите сделку, проверьте и подпишите кодом из СМС. Первые 3 договора бесплатно.
  description: |
    Closer помогает заключить договор без бумаги и встреч.

    1. Опишите сделку одним сообщением: что, сколько, к какому сроку.
    2. Бот соберёт договор по шаблону юриста.
    3. Отправьте ссылку второй стороне.
    4. Обе стороны подписывают кодом из СМС.

    Потом бот напомнит о сроке и поможет подписать акт.

    Подходит для физлиц, самозанятых, ИП и компаний. Первые 3 договора бесплатно.
  commands:
    start: "Начать"
    new: "Новый договор"
    my: "Мои договоры"
    profile: "Мой профиль"
    help: "Помощь"
  soon: "Скоро будет."
  unknown_message: "Пока я умею только команды из меню."

start:
  welcome: |
    Здравствуйте! Я Closer — помогаю оформить договор оказания услуг прямо в Telegram.

    Опишите сделку, я соберу договор по шаблону юриста, а вы и вторая сторона подпишете его кодом из СМС. Первые 3 договора — бесплатно.

help:
  text: |
    Closer собирает договор оказания услуг по шаблону: вы описываете сделку, вторая сторона подписывает по ссылке.
    Команды: /new — новый договор, /my — список, /profile — ваши данные для договора.
    Сейчас доступны базовые команды; полный сценарий подключим по этапам.
