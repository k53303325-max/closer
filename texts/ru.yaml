start:
  welcome: |
    Здравствуйте! Я Closer — помогаю оформить договор оказания услуг прямо в Telegram.

    Опишите сделку, я соберу договор по шаблону юриста, а вы и вторая сторона подпишете его кодом из СМС. Первые 3 договора — бесплатно.

    Сначала нужно принять соглашение об электронной подписи — это займёт минуту.

pep:
  intro: |
    <b>Соглашение о простой электронной подписи</b> (версия {pep_version})

    {summary}

    Полный текст — во вложении. Политика обработки ПДн: {pd_url}

    Отметьте согласие и нажмите «Продолжить».
  full_doc_caption: "Полный текст соглашения о ПЭП"
  toggle: "{mark} Принимаю Соглашение о ПЭП и даю согласие на обработку персональных данных"
  continue_btn: "Продолжить"
  must_check: "Отметьте согласие"

