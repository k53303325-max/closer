services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: closer
      POSTGRES_PASSWORD: closer
      POSTGRES_DB: closer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closer -d closer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build: .
    command: ["python", "-m", "closer.bot"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://closer:closer@postgres:5432/closer
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - appdata:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: ["arq", "closer.worker.tasks.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://closer:closer@postgres:5432/closer
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - appdata:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
